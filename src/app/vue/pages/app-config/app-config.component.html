<div class="page-wrap">

  <!-- Toasts -->
  <div role="status" aria-live="polite" class="toast toast-success" [class.toast-show]="success()">{{ success() }}</div>
  <div role="alert" class="toast toast-error"   [class.toast-show]="error()">{{ error() }}</div>

  <!-- En-tête -->
  <header class="page-hdr">
    <div>
      <h1 class="page-title">Configuration</h1>
      <p class="page-sub">Paramètres globaux de l'application</p>
    </div>
    <div class="page-actions" *ngIf="!loading()">
      <button class="btn btn-outline" (click)="cancel()" [disabled]="saving()">Annuler</button>
      <button class="btn btn-primary" (click)="requestSave()" [disabled]="saving()">
        <span *ngIf="!saving()">Enregistrer</span>
        <span *ngIf="saving()" class="spinner"></span>
      </button>
    </div>
  </header>

  <!-- Chargement -->
  <div class="loading-wrap" role="status" aria-live="polite" *ngIf="loading()">
    <div class="loading-spinner"></div>
    <span>Chargement...</span>
  </div>

  <div class="cfg-grid" *ngIf="!loading()">

    <!-- Compagnie -->
    <section class="cfg-card">
      <div class="cfg-card-hdr">Compagnie</div>
      <div class="cfg-card-body">
        <div class="field">
          <label for="app-config-logo-chemin-ou-url">Logo (chemin ou URL)</label>
          <input id="app-config-logo-chemin-ou-url" class="inp" [(ngModel)]="form.logoPath" placeholder="/assets/logo.png" />
        </div>
        <div class="field">
          <label for="app-config-nom">Nom</label>
          <input id="app-config-nom" class="inp" [(ngModel)]="form.companyName" placeholder="Rammsis Cleaning..." />
        </div>
        <div class="field field-full">
          <label for="app-config-adresse-civique">Adresse civique</label>
          <input id="app-config-adresse-civique" class="inp" [(ngModel)]="form.companyAddress" placeholder="123 rue Principale" />
        </div>
        <div class="field">
          <label for="app-config-ville">Ville</label>
          <input id="app-config-ville" class="inp" [(ngModel)]="form.companyCity" placeholder="Montréal" />
        </div>
        <div class="field">
          <label for="app-config-code-postal">Code postal</label>
          <input id="app-config-code-postal" class="inp" [(ngModel)]="form.companyPostalCode" placeholder="H2X 1Y6" />
        </div>
        <div class="field">
          <label for="app-config-province">Province</label>
          <input id="app-config-province" class="inp" [(ngModel)]="form.companyProvince" placeholder="QC" />
        </div>
        <div class="field">
          <label for="app-config-pays">Pays</label>
          <input id="app-config-pays" class="inp" [(ngModel)]="form.companyCountry" placeholder="Canada" />
        </div>
        <div class="field">
          <label for="app-config-numero-de-compte-de-programme-du-payeur">Numéro de compte de programme du payeur</label>
          <input id="app-config-numero-de-compte-de-programme-du-payeur" class="inp" [(ngModel)]="form.payerAccountNumber" placeholder="123456789RP0001" />
        </div>
        <div class="field">
          <label for="app-config-telephone">Téléphone</label>
          <input id="app-config-telephone" class="inp" [(ngModel)]="form.companyPhone" placeholder="514-555-0000" />
        </div>
        <div class="field">
          <label for="app-config-courriel">Courriel</label>
          <input id="app-config-courriel" class="inp" [(ngModel)]="form.companyEmail" placeholder="info@compagnie.com" />
        </div>
      </div>
    </section>

    <!-- Courriel (SMTP) -->
    <section class="cfg-card">
      <div class="cfg-card-hdr">Courriel (SMTP)</div>
      <div class="cfg-card-body">
        <div class="field">
          <label for="app-config-serveur">Serveur</label>
          <input id="app-config-serveur" class="inp" [(ngModel)]="form.smtpServer" placeholder="smtp.gmail.com" />
        </div>
        <div class="field">
          <label for="app-config-port">Port</label>
          <input id="app-config-port" class="inp" type="number" [(ngModel)]="form.smtpPort" placeholder="587" />
        </div>
        <div class="field">
          <label for="app-config-utilisateur">Utilisateur</label>
          <input id="app-config-utilisateur" class="inp" [(ngModel)]="form.smtpUser" placeholder="user@domaine.com" />
        </div>
        <div class="field">
          <label for="app-config-mot-de-passe">Mot de passe</label>
          <input id="app-config-mot-de-passe" class="inp" type="password" [(ngModel)]="form.smtpPassword" placeholder="••••••••" />
        </div>
      </div>
    </section>

    <!-- Taxes -->
    <section class="cfg-card">
      <div class="cfg-card-hdr">Taxes</div>
      <div class="cfg-card-body">
        <div class="field">
          <label for="app-config-n-tps">N° TPS</label>
          <input id="app-config-n-tps" class="inp" [(ngModel)]="form.tpsNumber" placeholder="123456789 RT0001" />
        </div>
        <div class="field">
          <label for="app-config-n-tvq">N° TVQ</label>
          <input id="app-config-n-tvq" class="inp" [(ngModel)]="form.tvqNumber" placeholder="1234567890 TQ0001" />
        </div>
        <div class="field">
          <label for="app-config-taux-tps">Taux TPS (%)</label>
          <input id="app-config-taux-tps" class="inp" type="number" step="0.001" [(ngModel)]="form.tpsRate" />
        </div>
        <div class="field">
          <label for="app-config-taux-tvq">Taux TVQ (%)</label>
          <input id="app-config-taux-tvq" class="inp" type="number" step="0.001" [(ngModel)]="form.tvqRate" />
        </div>
      </div>
    </section>

    <!-- Coordonnées bancaires -->
    <section class="cfg-card">
      <div class="cfg-card-hdr">Coordonnées bancaires</div>
      <div class="cfg-card-body">
        <div class="field field-full">
          <label for="app-config-coordonnees-de-paiement">Coordonnées de paiement</label>
          <textarea id="app-config-coordonnees-de-paiement" class="inp inp-textarea" rows="4" [(ngModel)]="form.bankCoordinates"
                    placeholder="Banque : ...&#10;Transit : ...&#10;Folio : ..."></textarea>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section class="cfg-card">
      <div class="cfg-card-hdr">Contact</div>
      <div class="cfg-card-body">
        <div class="field">
          <label for="app-config-nom-2">Nom</label>
          <input id="app-config-nom-2" class="inp" [(ngModel)]="form.contactName" placeholder="Jean Dupont" />
        </div>
        <div class="field">
          <label for="app-config-telephone-2">Téléphone</label>
          <input id="app-config-telephone-2" class="inp" [(ngModel)]="form.contactPhone" placeholder="514-555-0000" />
        </div>
        <div class="field">
          <label for="app-config-courriel-2">Courriel</label>
          <input id="app-config-courriel-2" class="inp" [(ngModel)]="form.contactEmail" placeholder="contact@compagnie.com" />
        </div>
      </div>
    </section>

    <!-- Application -->
    <section class="cfg-card">
      <div class="cfg-card-hdr">Application</div>
      <div class="cfg-card-body">
        <div class="field">
          <label for="app-config-version">Version</label>
          <input id="app-config-version" class="inp" [(ngModel)]="form.appVersion" placeholder="2.0.0" />
        </div>
      </div>
    </section>

  </div><!-- /cfg-grid -->
</div>

<!-- Modal confirmation (diff) -->
<div class="modal-backdrop" *ngIf="showDiff()" (click)="cancelDiff()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-hdr">
      <div class="modal-title">Confirmer les modifications</div>
      <button class="modal-close" (click)="cancelDiff()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <table class="diff-table">
        <thead>
          <tr><th>Champ</th><th>Ancienne valeur</th><th>Nouvelle valeur</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let d of diff">
            <td class="diff-label">{{ d.label }}</td>
            <td class="diff-old">{{ d.old }}</td>
            <td class="diff-new">{{ d.new }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="cancelDiff()">Annuler</button>
      <button class="btn btn-primary" (click)="confirmSave()">Enregistrer</button>
    </div>
  </div>
</div>
