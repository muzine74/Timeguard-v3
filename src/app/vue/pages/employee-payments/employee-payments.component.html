<div class="page-wrap">

  <header class="page-hdr">
    <div>
      <h1 class="page-title">Paiements employés</h1>
      <p class="page-sub">Comparer le gain cumulé et le montant payé, employé par employé</p>
    </div>
  </header>

  <div class="error-banner" *ngIf="error()">⚠ {{ error() }}</div>

  <!-- ── Filtres ─────────────────────────────────────────────────────────── -->
  <div class="filter-card">

    <div class="filter-field emp-filter">
      <label>Employés</label>
      <app-multi-select [options]="employeeOptions()" [(selected)]="selected"
                        placeholder="Choisir des employés…" plural="employés sélectionnés"></app-multi-select>
    </div>

    <div class="seg-control mode-seg">
      <button type="button" class="seg-opt" [class.active]="mode === 'period'" (click)="mode = 'period'">📅 Période</button>
      <button type="button" class="seg-opt" [class.active]="mode === 'range'" (click)="mode = 'range'">📆 Intervalle</button>
      <div class="seg-thumb" [class.thumb-right]="mode === 'range'"></div>
    </div>

    <ng-container *ngIf="mode === 'period'">
      <div class="filter-field">
        <label for="employee-payments-mois">Mois</label>
        <input id="employee-payments-mois" class="inp" type="month" [(ngModel)]="period" />
      </div>
    </ng-container>

    <ng-container *ngIf="mode === 'range'">
      <div class="filter-field">
        <label for="employee-payments-du">Du</label>
        <input id="employee-payments-du" class="inp" type="date" [(ngModel)]="dateFrom" />
      </div>
      <div class="filter-field">
        <label for="employee-payments-au">Au</label>
        <input id="employee-payments-au" class="inp" type="date" [(ngModel)]="dateTo" />
      </div>
    </ng-container>

    <div class="filter-field field-btn">
      <button class="btn btn-primary" [disabled]="loading()" (click)="load()">
        <span *ngIf="!loading()">⚡ Charger</span>
        <span *ngIf="loading()" class="spinner"></span>
      </button>
    </div>
  </div>

  <!-- ── Résultats ───────────────────────────────────────────────────────── -->
  <div class="results-hdr" *ngIf="rows().length > 0">
    <span class="results-title">Résultats</span>
    <div class="seg-control view-seg">
      <button type="button" class="seg-opt" [class.active]="resultsView() === 'daily'" (click)="resultsView.set('daily')">📆 Vue journalière</button>
      <button type="button" class="seg-opt" [class.active]="resultsView() === 'company'" (click)="resultsView.set('company')">🏢 Vue par compagnie</button>
      <div class="seg-thumb" [class.thumb-right]="resultsView() === 'company'"></div>
    </div>
  </div>

  <div class="results-list" *ngIf="rows().length > 0">
    <div *ngFor="let row of rows(); trackBy: trackByEmployeeId" class="payment-row" [class.mismatch]="hasMismatch(row)">
      <div class="payment-hdr">
        <button type="button" class="emp-name-btn" (click)="toggleExpand(row.employeeId)">
          <span class="chevron" [class.open]="isExpanded(row.employeeId)">▸</span>
          <span class="emp-name">{{ row.employeeName }}</span>
          <span class="nb-jours" *ngIf="row.workDays.length">({{ row.workDays.length }} jour{{ row.workDays.length > 1 ? 's' : '' }})</span>
        </button>
        <span class="save-msg" *ngIf="row.saveMessage">{{ row.saveMessage }}</span>
      </div>

      <div class="week-blocks" *ngIf="isExpanded(row.employeeId)">
        <div class="week-block" *ngFor="let block of weekBlocks(row); trackBy: trackByWeekStart">
          <button type="button" class="week-label" (click)="toggleWeek(row, block)">
            <span class="week-label-left">
              <span class="chevron" [class.open]="!isWeekCollapsed(row, block)">▸</span>
              {{ weekLabel(block) }}
            </span>
            <span class="week-total">{{ fmt(weekTotal(row, block)) }}</span>
          </button>

          <ng-container *ngIf="!isWeekCollapsed(row, block)">
            <div class="day-chips" *ngIf="resultsView() === 'daily'">
              <button type="button" class="day-chip" *ngFor="let w of block.days; trackBy: trackByDate"
                      [class.unchecked]="!isDaySelected(row, w) && !isDayPartial(row, w)"
                      [class.partial]="isDayPartial(row, w)"
                      (click)="toggleDay(row, w)" [title]="dayTooltip(w)">
                <span class="chip-check">{{ isDaySelected(row, w) ? '✓' : (isDayPartial(row, w) ? '±' : '') }}</span>
                <span class="day-name">{{ dayLabel(w.date) }}</span>
                <span class="day-amount">{{ fmt(w.amount) }}</span>
              </button>
            </div>

            <div class="day-chips" *ngIf="resultsView() === 'company'">
              <button type="button" class="day-chip company-chip" *ngFor="let c of companyBlocks(block); trackBy: trackByCompanyName"
                      [class.unchecked]="!isCompanySelected(row, c) && !isCompanyPartial(row, c)"
                      [class.partial]="isCompanyPartial(row, c)"
                      (click)="toggleCompany(row, c)" [title]="companyTooltip(c)">
                <span class="chip-check">{{ isCompanySelected(row, c) ? '✓' : (isCompanyPartial(row, c) ? '±' : '') }}</span>
                <span class="day-name">{{ c.name }}</span>
                <span class="day-amount">{{ fmt(c.total) }}</span>
              </button>
            </div>
          </ng-container>
        </div>
        <div class="week-empty" *ngIf="row.workDays.length === 0">Aucun jour travaillé sur cette période.</div>
      </div>

      <div class="payment-fields">
        <div class="field">
          <label>Gain cumulé</label>
          <div class="value-label">{{ fmt(row.gainCumule) }}</div>
        </div>
        <div class="field">
          <label>Montant payé (jours cochés)</label>
          <div class="value-label" [class.value-mismatch]="hasMismatch(row)">{{ fmt(row.amountPaid) }}</div>
        </div>
        <div class="field field-btn">
          <button class="btn" [disabled]="row.saving" (click)="saveRow(row)">
            <span *ngIf="!row.saving">💾 Enregistrer</span>
            <span *ngIf="row.saving" class="spinner"></span>
          </button>
        </div>
      </div>
      <div class="field span-full" *ngIf="hasMismatch(row)">
        <label [attr.for]="'pay-note-' + row.employeeId">⚠ Montant payé ≠ gain cumulé — note explicative</label>
        <textarea [attr.id]="'pay-note-' + row.employeeId" class="inp note-area" rows="2" [(ngModel)]="row.note" placeholder="Expliquer l'écart…"></textarea>
      </div>
    </div>
  </div>

</div>
