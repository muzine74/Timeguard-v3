<div class="toast" role="status" aria-live="polite"
     [class.toast-show]="saved()" [class.toast-error]="toastError()">{{ toast }}</div>
<div class="progress-bar" *ngIf="isSaving()">
  <div class="progress-fill" [style.width.%]="progress()"></div>
</div>

<div class="page-layout">

  <!-- ── Liste des employés (recherche + filtre par statut) ─────────────── -->
  <app-employee-list-panel
      [employees]="employees()"
      [loading]="loadingList()"
      [selectedId]="selectedId()"
      [validated]="allValidated()"
      (employeeSelect)="selectEmployee($event)"></app-employee-list-panel>

  <!-- ── Détail ─────────────────────────────────────────────────────────── -->
  <div class="content" *ngIf="selected(); else noSelection">

    <app-employee-profile-card
        [employee]="selected()!"
        [weekLocked]="isLocked()"
        [canEdit]="auth.hasPerm('employees.edit')"></app-employee-profile-card>

    <app-note-inline [refs]="noteRefs()"></app-note-inline>

    <app-stats-bar></app-stats-bar>

    <section class="section" aria-label="Pointage de la semaine">
      <app-section-header mode="employee" icon="👤"
        title="Pointage Employé" subtitle="Présences hebdomadaires par compagnie">
        <app-date-picker (weekChange)="onWeekChange()"></app-date-picker>
        <ng-container *ngIf="auth.canManage() || !isLocked()">
          <button class="btn btn-sm btn-ghost" (click)="ptEmpSvc.selectAll(weekSvc.weekDays())">Tout ✓</button>
          <button class="btn btn-sm btn-ghost" (click)="ptEmpSvc.clearAll()">Effacer</button>
        </ng-container>
        <!-- Sauvegarder puis Valider : les deux actions de l'étape, côte à côte -->
        <span class="dirty-flag" *ngIf="ptEmpSvc.isDirty() && !isLocked()" role="status">● Non sauvegardé</span>
        <button class="btn btn-primary" [class.btn-save-dirty]="ptEmpSvc.isDirty()" (click)="save()"
                [disabled]="isSaving() || (auth.canManage() && isLocked())">
          <span class="spinner" *ngIf="isSaving()"></span>
          <span *ngIf="!isSaving()">💾 Sauvegarder</span>
        </button>
        <button class="btn btn-validate"
                *ngIf="auth.canValidatePointage() && !isLocked()"
                [disabled]="!canValidateNow"
                [title]="ptEmpSvc.isDirty() ? 'Sauvegardez d\'abord vos modifications pour pouvoir valider' : 'Verrouiller cette semaine'"
                (click)="validateWeek()">
          <span *ngIf="!validating()">✅ Valider la semaine</span>
          <span *ngIf="validating()" class="spinner"></span>
        </button>
        <button class="btn btn-danger"
                *ngIf="auth.canValidatePointage() && isLocked()"
                [disabled]="validating()"
                (click)="unvalidateWeek()">
          <span *ngIf="!validating()">🔓 Annuler la validation</span>
          <span *ngIf="validating()" class="spinner"></span>
        </button>
      </app-section-header>

      <!-- Verrouillage : affiché juste au-dessus du tableau qu'il concerne -->
      <div class="lock-banner" *ngIf="isLocked()" role="status">
        <span class="lock-icon" aria-hidden="true">🔒</span>
        <span class="lock-txt">
          Semaine validée par l'admin
          <ng-container *ngIf="lockedAt()"> — le {{ lockedAt()! | date:'dd/MM/yyyy à HH:mm' }}</ng-container>
        </span>
      </div>

      <app-loading-spinner *ngIf="loadingDetail() || ptEmpSvc.isLoading(); else pointageTable" message="Chargement du pointage…"></app-loading-spinner>
      <ng-template #pointageTable>
        <app-pointage-table mode="employee" [locked]="isLocked()"></app-pointage-table>
      </ng-template>
    </section>

    <!-- ── Historique des semaines ── -->
    <app-week-history-panel
        [weeks]="weekHistory()"
        [currentWeek]="weekSvc.weekKey()"
        [employeeId]="selectedId()"
        (openWeek)="goToWeek($event)"></app-week-history-panel>

  </div>

  <ng-template #noSelection>
    <div class="no-selection" *ngIf="!detailError(); else detailErrorTpl">
      <span class="no-sel-icon" aria-hidden="true">👈</span>
      <h3>Sélectionnez un employé</h3>
      <p>Choisissez un employé dans la liste pour afficher ses données.</p>
    </div>
  </ng-template>

  <ng-template #detailErrorTpl>
    <div class="no-selection" role="alert">
      <span class="no-sel-icon" aria-hidden="true">⚠️</span>
      <h3>Chargement impossible</h3>
      <p>{{ detailError() }}</p>
    </div>
  </ng-template>

</div>
