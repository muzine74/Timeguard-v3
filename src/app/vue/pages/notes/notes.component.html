<div class="page-wrap">

  <header class="page-hdr">
    <div>
      <h1 class="page-title">Notes</h1>
      <p class="page-sub">Cliquez sur un titre pour afficher sa description</p>
    </div>
  </header>

  <!-- ── Ajouter une note ─────────────────────────────────────────────────── -->
  <div class="add-card">
    <input class="inp"
           type="text"
           placeholder="Titre de la note…"
           [(ngModel)]="newTitle"
           [disabled]="saving()" />
    <textarea class="inp inp-textarea"
              placeholder="Description (optionnel)…"
              [(ngModel)]="newDescription"
              [disabled]="saving()"
              rows="2"></textarea>
    <div class="add-actions">
      <label class="toggle-wrap">
        <input type="checkbox" [(ngModel)]="newActive" [disabled]="saving()">
        <span>Active</span>
      </label>
      <button class="btn btn-primary" [disabled]="!newTitle.trim() || saving()" (click)="add()">
        <span *ngIf="!saving()">+ Ajouter</span>
        <span *ngIf="saving()" class="spinner"></span>
      </button>
    </div>
  </div>

  <div class="err-msg" *ngIf="error()">{{ error() }}</div>

  <!-- ── Liste ────────────────────────────────────────────────────────────── -->
  <div class="loading-wrap" *ngIf="loading()">
    <div class="spinner"></div>
    <span>Chargement…</span>
  </div>

  <ng-container *ngIf="!loading()">
    <div class="note-list" *ngIf="notes().length > 0">
      <div class="note-card" *ngFor="let n of notes()" [class.note-inactive]="!n.isActive">

        <!-- En-tête cliquable : titre + statut -->
        <div class="note-header" (click)="toggleExpand(n)">
          <span class="expand-arrow" [class.expanded]="isExpanded(n)">▸</span>
          <span class="note-title">{{ n.title }}</span>
          <span class="note-author" *ngIf="n.createdByEmployeeName">{{ n.createdByEmployeeName }}</span>
          <div class="note-actions">
            <label class="toggle-wrap" (click)="$event.stopPropagation()">
              <input type="checkbox" [checked]="n.isActive" (change)="toggleActive(n, $event)">
              <span>{{ n.isActive ? 'Active' : 'Inactive' }}</span>
            </label>
            <button class="btn-icon" title="Modifier" (click)="startEdit(n, $event)">✎</button>
            <button class="btn-icon btn-icon-danger" title="Supprimer" (click)="remove(n, $event)">✕</button>
          </div>
        </div>

        <!-- Contenu déplié : description + édition -->
        <div class="note-content" *ngIf="isExpanded(n)">

          <ng-container *ngIf="editingId !== n.noteId">
            <p class="note-description" *ngIf="n.description">{{ n.description }}</p>
            <p class="note-description note-empty" *ngIf="!n.description">Aucune description</p>
            <span class="note-date">{{ fmtDate(n.createdAt) }}</span>
          </ng-container>

          <ng-container *ngIf="editingId === n.noteId">
            <input class="inp" type="text" [(ngModel)]="editTitle" (click)="$event.stopPropagation()" />
            <textarea class="inp inp-textarea" [(ngModel)]="editDescription" (click)="$event.stopPropagation()" rows="2"></textarea>
            <div class="add-actions">
              <label class="toggle-wrap" (click)="$event.stopPropagation()">
                <input type="checkbox" [(ngModel)]="editActive">
                <span>Active</span>
              </label>
              <button class="btn btn-ghost" (click)="cancelEdit($event)">Annuler</button>
              <button class="btn btn-primary" [disabled]="!editTitle.trim()" (click)="saveEdit(n, $event)">Enregistrer</button>
            </div>
          </ng-container>

        </div>

      </div>
    </div>

    <div class="empty-state" *ngIf="notes().length === 0">
      <div class="empty-icon">📝</div>
      <div class="empty-txt">Aucune note pour le moment</div>
    </div>
  </ng-container>

</div>
